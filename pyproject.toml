[project]
name = "tunnelterm"
description = "Web-based terminal: run any shell command in a PTY, accessed through the browser over WebSocket."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
# Version is derived from the latest git tag by setuptools-scm.
# - Tagged commit "v1.2.3" -> 1.2.3
# - Untagged HEAD          -> 1.2.4.dev3+g<sha>  (post-release scheme)
# CI strips the local "+g<sha>" suffix because PyPI rejects local versions.
dynamic = ["version"]

[project.scripts]
tunnelterm = "tunnelterm.__main__:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }
package-data = { tunnelterm = ["static/**/*"] }

[tool.setuptools_scm]
# Tag pattern: matches "v1.2.3", "v1.2.3rc1", etc. The leading "v" is stripped.
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*(?:[a-zA-Z]+\\d*)?)$"
# When building from an untagged commit (e.g. on master), produce a version
# like "0.1.1.dev3" rather than "0.1.0.post3.dev0+g<sha>".
version_scheme = "guess-next-dev"
# Strip the "+g<sha>" local-version suffix; PyPI rejects local versions.
local_scheme = "no-local-version"
# Fallback when building from a source tarball with no git history.
fallback_version = "0.0.0"

[tool.uv]
package = true


[tool.pyright]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
    "D",     # pydocstyle - enforces docstrings
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]
exclude = ["tests/**"]


[tool.ruff.lint.isort]
known-first-party = ["tunnelterm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "websockets>=14.0",
    "httpx>=0.27.0",
]
