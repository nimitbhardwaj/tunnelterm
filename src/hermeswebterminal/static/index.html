<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Hack Nerd Font', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, monospace;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #login-container {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        #login-form h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }
        #login-form p {
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }
        #password-input {
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #16213e;
            color: #eee;
            width: 280px;
            outline: none;
            transition: border-color 0.2s;
        }
        #password-input:focus {
            border-color: #4a9eff;
        }
        #login-btn {
            padding: 12px 32px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #4a9eff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        #login-btn:hover {
            background: #3a8eef;
        }
        #login-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #login-error {
            color: #ff6b6b;
            font-size: 14px;
            min-height: 20px;
        }
        #terminal-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        #status-bar {
            padding: 6px 12px;
            background: #16213e;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
        }
        #status-indicator.connected {
            background: #4ade80;
        }
        #status-indicator.disconnected {
            background: #ff6b6b;
        }
        #status-indicator.connecting {
            background: #fbbf24;
        }
        #terminal {
            flex: 1;
            padding: 8px;
            overflow: hidden;
        }
        #terminal .xterm {
            height: 100%;
        }
        #terminal .xterm-viewport {
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <form id="login-form">
            <h1>Hermes Web Terminal</h1>
            <p>Enter your password to access the terminal</p>
            <input type="password" id="password-input" placeholder="Password" autocomplete="off">
            <button type="submit" id="login-btn">Connect</button>
            <div id="login-error"></div>
        </form>
    </div>
    <div id="terminal-container">
        <div id="status-bar">
            <span id="status-indicator"></span>
            <span id="status-text">Connecting...</span>
        </div>
        <div id="terminal"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script>
        const loginContainer = document.getElementById('login-container');
        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const terminalContainer = document.getElementById('terminal-container');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        let term = null;
        let fitAddon = null;
        let ws = null;
        let authToken = null;

        function setStatus(status) {
            statusIndicator.className = status;
            if (status === 'connected') {
                statusText.textContent = 'Connected';
            } else if (status === 'disconnected') {
                statusText.textContent = 'Disconnected';
            } else if (status === 'connecting') {
                statusText.textContent = 'Connecting...';
            }
        }

        function initTerminal() {
            if (!term) {
                term = new Terminal({
                    cursorBlink: true,
                    fontSize: 14,
                    fontFamily: '"Hack Nerd Font", "Jetbrains Mono", "Fira Code", "Cascadia Code", Menlo, Monaco, monospace',
                    fontWeight: 'normal',
                    fontWeightBold: 'bold',
                });
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
                term.open(document.getElementById('terminal'));
                fitAddon.fit();
            }
            return term;
        }

        function connectTerminal() {
            const terminal = initTerminal();
            setStatus('connecting');
            const wsUrl = 'ws://' + window.location.host + '/ws?auth_token=' + encodeURIComponent(authToken);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setStatus('connected');
                setTimeout(() => {
                    if (fitAddon) {
                        fitAddon.fit();
                        const dims = { cols: terminal.cols, rows: terminal.rows };
                        ws.send(JSON.stringify({ type: 'resize', ...dims }));
                    }
                    terminal.write('\r\n\x1b[32mConnected to Hermes Web Terminal\x1b[0m\r\n\r\n');
                }, 100);
            };

            ws.onmessage = event => {
                if (typeof event.data === 'string') {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'process_exit') {
                            terminal.write('\r\n\x1b[33mProcess exited. Thanks for using Hermes Web Terminal!\x1b[0m\r\n');
                            document.getElementById('terminal').innerHTML = `
                                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
                                    <p style="color:#888;">Process has been closed.</p>
                                    <button id="reconnect-btn" style="padding:8px 24px;background:#4a9eff;color:white;border:none;border-radius:4px;cursor:pointer;">Reconnect</button>
                                </div>
                            `;
                            return;
                        }
                    } catch (_) {}
                    terminal.write(event.data);
                } else {
                    event.data.text().then(text => terminal.write(text));
                }
            };

            ws.onclose = () => {
                setStatus('disconnected');
                terminal.write('\r\n\x1b[33mProcess exited. Thanks for using Hermes Web Terminal!\x1b[0m\r\n');
                document.getElementById('terminal').innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
                        <p style="color:#888;">Process has been closed.</p>
                        <button id="reconnect-btn" style="padding:8px 24px;background:#4a9eff;color:white;border:none;border-radius:4px;cursor:pointer;">Reconnect</button>
                    </div>
                `;
                document.getElementById('reconnect-btn').addEventListener('click', () => location.reload());
            };

            ws.onerror = () => {
                setStatus('disconnected');
                terminal.write('\r\n\x1b[31mConnection error\x1b[0m\r\n');
            };

            terminal.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });

            terminal.onResize(({ cols, rows }) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols, rows }));
                }
            });
        }

        window.addEventListener('resize', () => {
            if (fitAddon) {
                fitAddon.fit();
            }
        });

        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            const password = passwordInput.value;
            loginBtn.disabled = true;
            loginError.textContent = '';

            try {
                const wsUrl = 'ws://' + window.location.host + '/auth';

                await new Promise((resolve, reject) => {
                    const authWs = new WebSocket(wsUrl);
                    authWs.onopen = async () => {
                        authWs.send(JSON.stringify({ password }));
                    };
                    authWs.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.token) {
                            authToken = data.token;
                            loginContainer.style.display = 'none';
                            terminalContainer.style.display = 'flex';
                            authWs.close();
                            resolve();
                        } else {
                            loginError.textContent = data.error || 'Authentication failed';
                            loginBtn.disabled = false;
                            authWs.close();
                            reject(new Error(data.error));
                        }
                    };
                    authWs.onerror = () => {
                        loginError.textContent = 'Connection failed';
                        loginBtn.disabled = false;
                        reject(new Error('Connection failed'));
                    };
                });

                connectTerminal();
            } catch (err) {
                // Error already handled in onmessage/onerror
            }
        });

        passwordInput.focus();
    </script>
</body>
</html>
